<header class="flex h-16 items-center justify-between border-b border-gray-200 bg-white px-4 shadow-sm">
  <div class="flex items-center space-x-4">
    <button
      type="button"
      class="rounded-md p-2 text-gray-600 hover:bg-gray-100 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-500"
      (click)="navegacaoService.alternarSidebar()"
      [attr.aria-expanded]="navegacaoService.sidebar()"
      aria-label="Abrir menu"
    >
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div class="flex items-center space-x-2">
      <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary-600">
        <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
          />
        </svg>
      </div>
      <h1 class="hidden text-xl font-bold text-gray-900 sm:block">EntregaSegura</h1>
    </div>
  </div>

  <div class="relative">
    <button
      type="button"
      class="flex items-center space-x-3 rounded-full p-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"
      (click)="alternarMenuUsuario()"
      [attr.aria-expanded]="menuUsuarioAberto()"
      aria-haspopup="true"
    >
      <div class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-300 text-sm font-medium text-gray-700">
        {{ obterIniciais() }}
      </div>

      <span class="hidden text-gray-700 md:block">
        {{ autenticacaoService.usuario()?.nome }}
      </span>

      <svg
        class="h-4 w-4 text-gray-400 transition-transform duration-200"
        [class.rotate-180]="menuUsuarioAberto()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <div
      *ngIf="menuUsuarioAberto()"
      class="absolute right-0 mt-2 w-56 origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none"
      role="menu"
      aria-orientation="vertical"
    >
      <div class="py-1">
        <div class="border-b border-gray-100 px-4 py-3">
          <p class="text-sm font-medium text-gray-900">{{ autenticacaoService.usuario()?.nome }}</p>
          <p class="text-sm text-gray-500">{{ autenticacaoService.usuario()?.email }}</p>
          <p class="mt-1 text-xs text-gray-400">{{ autenticacaoService.papel() }}</p>
        </div>

        <a
          href="#"
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
          role="menuitem"
          (click)="navegarPara('/perfil'); $event.preventDefault()"
        >
          <div class="flex items-center space-x-2">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <span>Meu Perfil</span>
          </div>
        </a>

        <a
          href="#"
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
          role="menuitem"
          (click)="navegarPara('/configuracoes'); $event.preventDefault()"
        >
          <div class="flex items-center space-x-2">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            <span>Configurações</span>
          </div>
        </a>

        <div class="border-t border-gray-100">
          <button
            type="button"
            class="block w-full px-4 py-2 text-left text-sm text-red-700 hover:bg-red-50"
            role="menuitem"
            (click)="efetuarLogout()"
          >
            <div class="flex items-center space-x-2">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                />
              </svg>
              <span>Sair</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<div *ngIf="menuUsuarioAberto()" class="fixed inset-0 z-10" (click)="fecharMenuUsuario()" aria-hidden="true"></div>
