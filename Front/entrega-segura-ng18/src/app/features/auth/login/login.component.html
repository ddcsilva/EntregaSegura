<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-8">
    <!-- Header -->
    <div>
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-xl bg-primary-600">
        <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
          />
        </svg>
      </div>
      <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">EntregaSegura</h2>
      <p class="mt-2 text-center text-sm text-gray-600">Faça login para acessar o sistema</p>
    </div>

    <!-- Formulário -->
    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()" data-testid="login-form">
      <!-- Email -->
      <div>
        <label for="login" class="block text-sm font-medium text-gray-700"> Email ou Login </label>
        <div class="mt-1">
          <input
            id="login"
            name="login"
            type="text"
            autocomplete="email"
            required
            formControlName="login"
            class="relative block w-full appearance-none rounded-lg border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-500 focus:z-10 focus:border-primary-500 focus:outline-none focus:ring-primary-500 sm:text-sm"
            [class.border-red-500]="isFieldInvalid('login')"
            placeholder="Digite seu email"
            data-testid="login-input"
          />
          <!-- Erro do email -->
          <p *ngIf="isFieldInvalid('login')" class="mt-1 text-sm text-red-600" data-testid="login-error">
            Email é obrigatório
          </p>
        </div>
      </div>

      <!-- Senha -->
      <div>
        <label for="senha" class="block text-sm font-medium text-gray-700"> Senha </label>
        <div class="relative mt-1">
          <input
            id="senha"
            name="senha"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            required
            formControlName="senha"
            class="relative block w-full appearance-none rounded-lg border border-gray-300 px-3 py-2 pr-10 text-gray-900 placeholder-gray-500 focus:z-10 focus:border-primary-500 focus:outline-none focus:ring-primary-500 sm:text-sm"
            [class.border-red-500]="isFieldInvalid('senha')"
            placeholder="Digite sua senha"
            data-testid="password-input"
          />
          <!-- Toggle password visibility -->
          <button
            type="button"
            class="absolute inset-y-0 right-0 flex items-center pr-3"
            (click)="togglePasswordVisibility()"
            data-testid="password-toggle"
          >
            <svg
              class="h-5 w-5 text-gray-400 hover:text-gray-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                *ngIf="!showPassword()"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              />
              <path
                *ngIf="showPassword()"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"
              />
            </svg>
          </button>
          <!-- Erro da senha -->
          <p *ngIf="isFieldInvalid('senha')" class="mt-1 text-sm text-red-600" data-testid="password-error">
            Senha é obrigatória
          </p>
        </div>
      </div>

      <!-- Erro geral -->
      <div *ngIf="authService.erro()" class="rounded-lg border border-red-200 bg-red-50 p-4" data-testid="auth-error">
        <div class="flex">
          <svg class="h-5 w-5 text-red-400" fill="currentColor" viewBox="0 0 20 20">
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            />
          </svg>
          <p class="ml-2 text-sm text-red-700">
            {{ authService.erro() }}
          </p>
        </div>
      </div>

      <!-- Botão de login -->
      <div>
        <es-button
          type="submit"
          variant="primary"
          size="lg"
          [larguraTotal]="true"
          [desabilitado]="loginForm.invalid"
          [carregando]="authService.carregando()"
          data-testid="login-button"
        >
          {{ authService.carregando() ? 'Entrando...' : 'Entrar' }}
        </es-button>
      </div>
    </form>
  </div>
</div>
